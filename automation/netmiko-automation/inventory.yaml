# ============================================================
# EE8203 Network Automation — Device Inventory
# ============================================================
# ALL device connection parameters are defined here.
# Python scripts read from this file — NO credentials are
# hardcoded in any script.
#
# ⚠️  IMPORTANT — INTERFACE NAMES:
#   R-CORE uses Cisco c7200 with FastEthernet cards:
#     - FastEthernet0/0 → SW-CORE
#     - FastEthernet1/0 → R-EDGE
#   R-EDGE uses Cisco c7200 with FastEthernet cards:
#     - FastEthernet0/0 → R-CORE (inside)
#     - FastEthernet1/0 → Internet NAT cloud (outside)
# ============================================================

# ----------------------------------------------------------
# Shared credentials (all devices use the same login)
# ----------------------------------------------------------
credentials:
  username: "admin"
  password: "admin123"
  secret: "admin123"       # Enable password (priv 15 auto-enables)

# ----------------------------------------------------------
# ROUTERS (Cisco c7200 in GNS3)
# ----------------------------------------------------------
routers:
  - hostname: "R-CORE"
    host: "10.0.0.2"              # Reachable from VLAN 99 via SW-Core OSPF routes
    device_type: "cisco_ios"      # c7200 uses standard cisco_ios
    role: "core_router"
    interfaces:
      - name: "FastEthernet0/0"
        description: "LINK_TO_R-EDGE"
        ip_address: "10.0.1.1"
        subnet_mask: "255.255.255.252"
      - name: "FastEthernet1/0"
        description: "LINK_TO_SW-CORE"
        ip_address: "10.0.0.2"
        subnet_mask: "255.255.255.252"
    ospf:
      process_id: 1
      router_id: "2.2.2.2"
      networks:
        - { network: "10.0.0.0", wildcard: "0.0.0.3", area: 0 }
        - { network: "10.0.1.0", wildcard: "0.0.0.3", area: 0 }
      default_originate: true     # Propagate default route from R-EDGE
    # Default route to R-EDGE for internet access
    static_routes:
      - { destination: "0.0.0.0", mask: "0.0.0.0", next_hop: "10.0.1.2" }

  - hostname: "R-EDGE"
    host: "10.0.1.2"              # Reachable from VLAN 99 via SW-Core → R-CORE routing
    device_type: "cisco_ios"
    role: "edge_router"
    interfaces:
      # FastEthernet (not GigabitEthernet) — confirmed in fixed_ping_from_ubunthu.md
      - name: "FastEthernet0/0"
        description: "LINK_TO_R-CORE"
        ip_address: "10.0.1.2"
        subnet_mask: "255.255.255.252"
        nat_direction: "inside"
      - name: "FastEthernet1/0"
        description: "LINK_TO_INTERNET_ISP"
        ip_address: "dhcp"
        subnet_mask: ""
        nat_direction: "outside"
    ospf:
      process_id: 1
      router_id: "4.4.4.4"
      networks:
        - { network: "10.0.1.0", wildcard: "0.0.0.3", area: 0 }
      default_originate: true
    nat:
      acl_number: 100             # Using numbered ACL (per fixed_ping doc)
      permitted_networks:
        - { network: "10.99.99.0", wildcard: "0.0.0.255" }    # MGMT VLAN gets internet
        - { network: "10.10.10.0", wildcard: "0.0.0.255" }    # VLAN_DEIE gets internet
        - { network: "10.10.20.0", wildcard: "0.0.0.255" }    # VLAN_DCEE gets internet
      outside_interface: "FastEthernet1/0"
    # Static aggregate route for all internal traffic via R-CORE
    static_routes:
      - { destination: "10.0.0.0", mask: "255.0.0.0", next_hop: "10.0.1.1" }

# ----------------------------------------------------------
# L3 DISTRIBUTION SWITCHES (IOSvL2 in GNS3, L3 mode)
# ----------------------------------------------------------
# These are multilayer switches with ip routing enabled.
# Managed by Ansible (ansible-project/), listed here for
# SNMP push and verification scripts.
l3_switches:
  - hostname: "SW-Core"
    host: "10.99.99.1"
    device_type: "cisco_ios"

  - hostname: "SW-D-DEIE"
    host: "10.99.99.11"
    device_type: "cisco_ios"

  - hostname: "SW-D-DCEE"
    host: "10.99.99.12"
    device_type: "cisco_ios"

  - hostname: "SW-D-DMME"
    host: "10.99.99.13"
    device_type: "cisco_ios"

# ----------------------------------------------------------
# L2 ACCESS SWITCHES (IOSvL2 in GNS3)
# ----------------------------------------------------------
# NOTE: No SW-D-DIS exists in the topology.
#       SW-A-DIS connects directly to SW-CORE.
l2_switches:
  - hostname: "SW-A-DEIE"
    host: "10.99.99.21"
    device_type: "cisco_ios"

  - hostname: "SW-A-DCEE"
    host: "10.99.99.22"
    device_type: "cisco_ios"

  - hostname: "SW-A-DMME"
    host: "10.99.99.23"
    device_type: "cisco_ios"

  - hostname: "SW-A-DIS"
    host: "10.99.99.24"
    device_type: "cisco_ios"

# ----------------------------------------------------------
# SNMP Settings (pushed to ALL devices by script 02)
# ----------------------------------------------------------
snmp:
  community_ro: "public"                # Read-only community string
  community_rw: "private"               # Read-write community string
  trap_destination: "10.10.40.100"      # Zabbix/NMS server in DIS VLAN
  snmp_version: "2c"
