# ============================================================
# host_vars/SW-D-DCEE.yml — Distribution Switch for DCEE
# ============================================================
# LAYER 3 MULTILAYER SWITCH
#
# Topology connections (from GNS3):
#   Gi0/2 → SW-CORE (Gi0/2)     [ROUTED PORT — 10.0.20.2/30]
#   Gi0/0 → SW-A-DCEE (Gi0/0)   [trunk downlink]
#
# L3 Responsibilities:
#   - Department gateway: VLAN 20 SVI (10.10.20.1/24)
#   - MGMT SVI: VLAN 99 (10.99.99.12/24)
#   - OSPF area 0 with SW-CORE
#   - Static return route for Docker (10.99.99.100)
# ============================================================

# ----------------------------------------------------------
# Routed Uplink to SW-CORE (Layer 3 — no switchport)
# ----------------------------------------------------------
routed_uplink:
  name: GigabitEthernet0/2
  description: ROUTED_LINK_TO_SW-CORE
  ip_address: "10.0.20.2"
  subnet_mask: "255.255.255.252"

# ----------------------------------------------------------
# Trunk Downlink to Access Switch (Layer 2)
# ----------------------------------------------------------
trunk_interfaces:
  - name: GigabitEthernet0/0
    description: TRUNK_TO_SW-A-DCEE
    native_vlan: 100
    allowed_vlans: "10,20,30,40,99,100"

# ----------------------------------------------------------
# Department VLAN SVI (this switch is the gateway)
# ----------------------------------------------------------
department_svi:
  vlan_id: 20
  description: GW_VLAN_DCEE
  ip_address: "10.10.20.1"
  subnet_mask: "255.255.255.0"

# ----------------------------------------------------------
# Management VLAN 99 SVI
# ----------------------------------------------------------
mgmt_svi:
  vlan_id: 99
  description: MGMT_INTERFACE
  ip_address: "10.99.99.12"
  subnet_mask: "255.255.255.0"

# ----------------------------------------------------------
# OSPF Configuration
# ----------------------------------------------------------
ospf_router_id: "3.3.3.12"
ospf_networks:
  - { network: "10.0.20.0", wildcard: "0.0.0.3", area: 0 }
  - { network: "10.10.20.0", wildcard: "0.0.0.255", area: 0 }
  - { network: "10.99.99.0", wildcard: "0.0.0.255", area: 0 }
ospf_active_interface: GigabitEthernet0/2

# ----------------------------------------------------------
# Static Route — Docker return path (VLAN 99 L2 split fix)
# ----------------------------------------------------------
docker_return_route_nexthop: "10.0.20.1"

# No access ports on distribution switches
access_interfaces: []
