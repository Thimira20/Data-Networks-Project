# ============================================================
# site.yml — Master Playbook for Switch Automation
# ============================================================
# EE8203/EC8205 Design & Management of Data Networks
# University of Ruhuna — 8th Semester Project
#
# This playbook orchestrates all switch configuration in the
# correct deployment sequence, respecting the L3 distribution
# and L2 access layer architecture:
#
#   1. VLANs      → all switches   (VLAN database must exist first)
#   2. Trunking   → all switches   (inter-switch links)
#   3. Access     → all switches   (PC-facing ports with PortFast)
#   4. STP        → all switches   (priorities and portfast default)
#   5. L3 Dist    → dist only      (ip routing, SVIs, OSPF, routes)
#   6. L2 Gateway → access only    (ip default-gateway)
#   7. Save       → all switches   (write memory)
#
# Usage:
#   ansible-playbook site.yml              # Full deployment
#   ansible-playbook site.yml --check      # Dry-run (no changes)
#   ansible-playbook site.yml -v           # Verbose output
#   ansible-playbook site.yml --tags vlans # Run only VLANs
# ============================================================
---
# ── Play 1: Create VLANs on ALL switches ─────────────────────
- name: "Step 1 — Create VLANs on all switches"
  hosts: all_switches
  gather_facts: false
  tags: [vlans]
  roles:
    - vlans

# ── Play 2: Configure trunk links on ALL switches ────────────
# Distribution: trunk downlinks to access switches
# Access: trunk uplinks to distribution switches (or SW-CORE)
- name: "Step 2 — Configure trunk ports on all switches"
  hosts: all_switches
  gather_facts: false
  tags: [trunking]
  roles:
    - trunking

# ── Play 3: Configure access ports (PCs) ─────────────────────
- name: "Step 3 — Assign access ports to department VLANs"
  hosts: all_switches
  gather_facts: false
  tags: [access_ports]
  roles:
    - access_ports

# ── Play 4: Configure Spanning Tree Protocol ─────────────────
- name: "Step 4 — Configure STP parameters"
  hosts: all_switches
  gather_facts: false
  tags: [stp]
  roles:
    - stp

# ── Play 5: Layer 3 Distribution Switch Configuration ────────
# ONLY runs on dist_switches (SW-D-DEIE, SW-D-DCEE, SW-D-DMME)
# Enables ip routing, configures routed uplinks, SVIs, OSPF,
# and Docker return routes.
- name: "Step 5 — Configure L3 distribution (ip routing, SVIs, OSPF)"
  hosts: dist_switches
  gather_facts: false
  tags: [l3_distribution]
  roles:
    - l3_distribution

# ── Play 6: Layer 2 Access Switch Default Gateway ────────────
# ONLY runs on access_switches (SW-A-DEIE, SW-A-DCEE, SW-A-DMME, SW-A-DIS)
# Sets ip default-gateway to local distribution switch.
- name: "Step 6 — Set L2 access switch default gateways"
  hosts: access_switches
  gather_facts: false
  tags: [l2_gateway]
  roles:
    - l2_gateway

# ── Play 7: Save configuration to NVRAM ──────────────────────
- name: "Step 7 — Save configuration (write memory)"
  hosts: all_switches
  gather_facts: false
  tags: [save]
  tasks:
    - name: Save running-config to startup-config
      cisco.ios.ios_config:
        save_when: always
      register: save_result

    - name: Report save status
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — Configuration saved to NVRAM ✓"
