[defaults]
# Inventory file location
inventory = inventory/hosts

# Disable host key checking (lab environment only)
host_key_checking = False

# Default user
remote_user = admin

# Connection timeout (GNS3 devices can be slow)
timeout = 60

# Retry on unreachable
retries = 3

# Forks (parallel connections) — keep low for GNS3 stability
forks = 5

# Reduce output noise
deprecation_warnings = False

# Persist facts between plays
gathering = smart

[persistent_connection]
# Timeout for persistent connections (network_cli)
connect_timeout = 60
command_timeout = 60
