# ============================================================
# playbooks/rollback.yml — Rollback to Clean Baseline
# ============================================================
# EE8203/EC8205 Design & Management of Data Networks
# University of Ruhuna — 8th Semester Project
#
# Purpose:
#   Restores all switches to a clean baseline by:
#     1. Removing L3 config from distribution switches (OSPF,
#        SVIs, static routes, ip routing, routed ports → trunk)
#     2. Removing default-gateway from access switches
#     3. Removing non-default VLANs (10, 20, 30, 40, 99, 100)
#     4. Resetting configured interfaces to default
#     5. Removing STP customizations
#     6. Saving the clean configuration
#
# Target execution time: < 5 minutes
#
# Usage:
#   ansible-playbook playbooks/rollback.yml
#
# ⚠ WARNING: This removes ALL automation-applied configuration!
#   Switches will lose VLAN assignments, trunk configs, access
#   port settings, L3 routing, and OSPF. Management connectivity
#   via VLAN 99 will be disrupted.
# ============================================================
---
# ── Phase 1: Rollback L3 Distribution Config ─────────────────
- name: "ROLLBACK Phase 1 — Remove L3 distribution config"
  hosts: dist_switches
  connection: network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    # Remove OSPF process
    - name: "Remove OSPF process"
      cisco.ios.ios_config:
        lines:
          - "no router ospf {{ ospf_process_id | default(1) }}"
      ignore_errors: true

    # Remove department VLAN SVI
    - name: "Remove department VLAN SVI"
      cisco.ios.ios_config:
        lines:
          - "no interface Vlan{{ department_svi.vlan_id }}"
      when: department_svi is defined
      ignore_errors: true

    # Remove Docker static route
    - name: "Remove Docker return route"
      cisco.ios.ios_config:
        lines:
          - "no ip route {{ docker_host_ip }} 255.255.255.255 {{ docker_return_route_nexthop }}"
      when:
        - docker_host_ip is defined
        - docker_return_route_nexthop is defined
      ignore_errors: true

    # Convert routed uplink back to switchport
    - name: "Revert routed uplink to switchport"
      cisco.ios.ios_config:
        parents: "interface {{ routed_uplink.name }}"
        lines:
          - "no ip address"
          - "switchport"
          - "switchport trunk encapsulation dot1q"
          - "switchport mode trunk"
          - "switchport trunk native vlan 100"
          - "switchport trunk allowed vlan 10,20,30,40,99,100"
          - "no shutdown"
      when: routed_uplink is defined
      ignore_errors: true

    # Disable ip routing
    - name: "Disable ip routing"
      cisco.ios.ios_config:
        lines:
          - "no ip routing"
      ignore_errors: true

    # Restore ip default-gateway (L2 mode)
    - name: "Restore ip default-gateway for L2 mode"
      cisco.ios.ios_config:
        lines:
          - "ip default-gateway 10.99.99.1"
      ignore_errors: true

# ── Phase 2: Rollback L2 Access Config ───────────────────────
- name: "ROLLBACK Phase 2 — Remove access switch default gateways"
  hosts: access_switches
  connection: network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    - name: "Remove ip default-gateway"
      cisco.ios.ios_config:
        lines:
          - "no ip default-gateway"
      ignore_errors: true

# ── Phase 3: Rollback All Switches ───────────────────────────
- name: "ROLLBACK Phase 3 — Reset all switches to baseline"
  hosts: all_switches
  connection: network_cli
  gather_facts: false
  vars:
    ansible_network_os: cisco.ios.ios
    rollback_vlans:
      - 10
      - 20
      - 30
      - 40
      - 99
      - 100

  tasks:
    # Reset trunk interfaces to default
    - name: "Reset trunk interfaces to default"
      cisco.ios.ios_config:
        lines:
          - "default interface {{ item.name }}"
      loop: "{{ trunk_interfaces | default([]) }}"
      loop_control:
        label: "Resetting {{ item.name }}"
      ignore_errors: true

    # Reset access interfaces to default
    - name: "Reset access interfaces to default"
      cisco.ios.ios_config:
        lines:
          - "default interface {{ item.name }}"
      loop: "{{ access_interfaces | default([]) }}"
      loop_control:
        label: "Resetting {{ item.name }}"
      ignore_errors: true

    # Remove non-default VLANs
    - name: "Remove VLANs"
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item }}"
        state: deleted
      loop: "{{ rollback_vlans }}"
      loop_control:
        label: "Removing VLAN {{ item }}"
      ignore_errors: true

    # Remove STP customizations
    - name: "Remove STP customizations"
      cisco.ios.ios_config:
        lines:
          - "no spanning-tree portfast default"
          - "spanning-tree mode pvst"
      ignore_errors: true

    # Save clean configuration
    - name: "Save clean configuration"
      cisco.ios.ios_config:
        save_when: always

    - name: Rollback complete
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} — Rollback complete ✓
          All VLANs, trunks, access ports, STP, L3 routing,
          and OSPF settings have been reset.
